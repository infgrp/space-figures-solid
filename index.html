    fly.t += dt; const u = Math.min(1, fly.t / fly.dur), e = easeIO(u);
    if (fly.ctrl) { const a = fly.p0.clone().lerp(fly.ctrl, e), b = fly.ctrl.clone().lerp(fly.p1, e); cam.p.copy(a.lerp(b, e)); }
    else cam.p.copy(fly.p0).lerp(fly.p1, e);
    cam.t.copy(fly.t0).lerp(fly.t1, easeIO(Math.min(1, u * 1.08)));
    if (u >= 1) fly = null;
  }
  const sm = 1 - Math.exp(-dt * 8);
  for (const k in view) viewS[k] += (view[k] - viewS[k]) * sm;
  // 과녁을 중심으로 천천히 돌아 입체감을 계속 보여 준다 + 사용자 회전·확대·이동
  const ang = viewS.yaw + Math.sin(time * 0.21) * 0.06 + (step === STEPS.length - 1 ? (time - stepT0) * 0.05 : 0);
  off.copy(cam.p).sub(cam.t).applyAxisAngle(UP, ang);
  right.copy(off).cross(UP).normalize();
  const el0 = Math.asin(THREE.MathUtils.clamp(off.y / off.length(), -1, 1));
  const pitch = THREE.MathUtils.clamp(el0 + viewS.pitch, -0.05, 1.45) - el0;
  off.applyAxisAngle(right, pitch).multiplyScalar(Math.exp(viewS.zoom));
  fwd.copy(cam.t).addScaledVector(right, -viewS.px).add(V3(0, viewS.py, 0));
  camera.position.copy(fwd).add(off).add(V3(0, Math.sin(time * 0.33) * 0.6, 0));
  camera.position.y = Math.max(camera.position.y, 1.5);
  camera.lookAt(fwd);
  fill.position.copy(camera.position); fill.target.position.copy(fwd);
  if (auto && !fly) { autoT += dt; if (voiceBusy()) autoT = 0; if (autoT > (voiceOn && primed && !narr.error ? 1.6 : step === 0 ? 7 : 9) + (HOLDS[step] || 0)) { autoT = 0; if (step < STEPS.length - 1) go(step + 1); else { auto = false; $("bAuto").setAttribute("aria-pressed", "false"); } } }
}

/* ═════════════ 영상 녹화 (?rec=1) — record.mjs 가 1/60 초씩 진행시키며 한 장씩 받아 간다 ═════════════ */
const REC = { on: QS.has("rec"), ready: false,
  intro() { startIntro(); },
  go(n) { go(n); },
  skip(n) { for (let i = 0; i < n; i++) { scene.updateMatrixWorld(); tick(1 / 60); } },   // 그리지 않고 시간만 진행 (일부 구간 다시 녹화용)
  shot(q = 0.93) { scene.updateMatrixWorld(); tick(1 / 60); renderer.render(scene, camera); return renderer.domElement.toDataURL("image/jpeg", q); },
};
window.REC = REC;

/* ═════════════ 시작 ═════════════ */
(async () => {
  const prog = (f, msg) => { $("lbar").style.width = (f * 100).toFixed(0) + "%"; $("lmsg").textContent = msg || ""; };
  try {
    await MathJax.startup.promise;
    if (!FONT_BODY || !FONT_TITLE) throw new Error("글꼴이 비어 있습니다 (build_fonts.py 를 실행하세요)");
    FB = opentype.parse(b64buf(FONT_BODY)); FT = opentype.parse(b64buf(FONT_TITLE));
    const t0 = performance.now(); await buildAll(prog); console.log("build ms", Math.round(performance.now() - t0));
  } catch (e) { $("lmsg").textContent = "오류: " + e.message; console.error(e.stack); return; }
  prog(1, "");
  const startStep = parseInt(QS.get("step") || "-1", 10);
  if (startStep >= 0) {
    introReady = true; introT = 99; go(startStep, true);
    for (const o of anims) o.v = o.when() ? 1 : -o.delay; for (const o of anims) o.apply(o.v);
    // 시험용: ?step=N&goto=1&sim=초 → 다음 단계로 넘어가 그만큼 시간을 흘린 모습
    if (QS.has("goto")) { go(step + 1); const n = Math.round(parseFloat(QS.get("sim") || "0") * 60); for (let i = 0; i < n; i++) { scene.updateMatrixWorld(); tick(1 / 60); } }
  } else { startIntro(); const n = Math.round(parseFloat(QS.get("sim") || "0") * 60); for (let i = 0; i < n; i++) { scene.updateMatrixWorld(); tick(1 / 60); } }
  $("load").style.opacity = 0; setTimeout(() => $("load").remove(), 1300);
  REC.ready = true;
  setTimeout(() => $("hint").style.opacity = 0, 9000);
  requestAnimationFrame(frame);
})();
</script>
